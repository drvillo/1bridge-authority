name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install pnpm
        run: npm install --global pnpm@10.29.3
      # Reproducible install: fails if pnpm-lock.yaml drifts.
      # --ignore-scripts is redundant with .npmrc but explicit here as a hard gate.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      # Verify the published tarball only contains what "files" allows.
      - name: Inspect publish contents
        run: npm pack --dry-run
