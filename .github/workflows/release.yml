name: Release

on:
  # Publish when a GitHub Release is published (tag it, write notes, publish).
  release:
    types: [published]
  # Manual escape hatch for re-runs.
  workflow_dispatch:

# id-token: write is what enables npm provenance + OIDC Trusted Publishing.
# No long-lived NPM_TOKEN is stored anywhere.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: build + publish (provenance)
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Publish gates run explicitly here because .npmrc ignore-scripts disables
      # the prepublishOnly hook during `npm publish`.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # Trusted Publishing requires npm >= 11.5.1 for OIDC exchange.
      # Pin to npm@11: npm@latest (12+) needs Node ^22.22 / ^24.15, and this
      # job stays on Node 22 to match package engines.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      # With a Trusted Publisher configured on npmjs.com for this repo+workflow,
      # no token is needed and provenance is attached automatically.
      - name: Publish to npm
        run: npm publish --provenance --access public
